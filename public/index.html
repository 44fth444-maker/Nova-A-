
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>NOVA AI</title>
<style>
*{box-sizing:border-box}
:root{color-scheme:light}
body{margin:0;background:#fff;color:#222;font-family:Arial,sans-serif}
header{height:60px;display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid #eee;background:#fff;position:sticky;top:0;z-index:2}
header h2{font-size:19px;margin:0;font-weight:700}
.icon-btn{width:40px;height:40px;border:0;border-radius:50%;background:transparent;color:#222;font-size:23px;cursor:pointer;display:grid;place-items:center}
.icon-btn:hover{background:#f2f2f2}
#newchat{margin-left:auto;border:1px solid #ddd;border-radius:20px;padding:9px 13px;background:white;color:#222;font-size:13px}
#chat{height:calc(100dvh - 145px);overflow-y:auto;padding:20px 16px 30px;max-width:800px;margin:auto}
.msg{padding:13px 16px;margin:15px 0;border-radius:18px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.55;font-size:16px}
.bot{background:#f7f7f8;margin-right:4%;border:1px solid #eee}
.user{background:#f1f1f1;color:#222;margin-left:12%;border-radius:18px}
#welcome{text-align:center;margin:18vh auto 30px;font-size:25px;font-weight:600}
#welcome p{font-size:14px;font-weight:400;color:#777;margin-top:12px}
#suggestions{display:grid;grid-template-columns:1fr 1fr;gap:9px;max-width:500px;margin:0 auto 24px}
.suggestion{background:white;border:1px solid #ddd;border-radius:15px;padding:14px;text-align:left;color:#333;font-size:14px;cursor:pointer}
.suggestion:hover{background:#f7f7f7}
form{position:fixed;bottom:0;left:0;right:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(#fff,#fff);border-top:1px solid #eee;display:flex;justify-content:center;z-index:3}
#composer{width:100%;max-width:800px;display:flex;align-items:flex-end;gap:8px;padding:7px 8px 7px 14px;border:1px solid #ddd;border-radius:25px;box-shadow:0 2px 8px #0000000a;background:#fff}
#message{flex:1;min-width:0;max-height:130px;resize:none;border:0;outline:0;background:transparent;color:#222;padding:10px 0;font:16px Arial,sans-serif}
#message::placeholder{color:#888}
#send,#mic{flex-shrink:0;width:40px;height:40px;border:0;border-radius:50%;display:grid;place-items:center;cursor:pointer}
#send{background:#171717;color:white;font-size:23px}
#mic{background:#f1f1f1;color:#222;font-size:19px}
#send:disabled{opacity:.4}
#status{text-align:center;color:#888;font-size:11px;margin:5px 0 0}
#historyPanel{display:none;position:fixed;inset:0;z-index:5;background:#0005}
#historyPanel.open{display:block}
#sidebar{width:min(300px,85vw);height:100%;background:#f7f7f7;padding:18px}
#sidebar h3{margin:8px 0 20px}
#historyList{margin-top:15px;display:grid;gap:8px}
.history-item{padding:12px;border:0;border-radius:10px;background:white;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#222}
@media(min-width:650px){#chat{height:calc(100dvh - 145px);padding-top:28px}.msg{max-width:85%}}
</style>
</head>
<body>
<header>
<button class="icon-btn" id="historyBtn" type="button" aria-label="Sohbet geçmişi">☰</button>
<h2>NOVA AI</h2>
<button id="newchat" type="button">＋ Yeni sohbet</button>
</header>

<div id="historyPanel">
<div id="sidebar">
<button class="icon-btn" id="closeHistory" type="button">✕</button>
<h3>Sohbet geçmişi</h3>
<button id="sideNew" class="suggestion" type="button">＋ Yeni sohbet</button>
<div id="historyList"></div>
</div>
</div>

<div id="chat">
<div id="welcome">Nasıl yardımcı olabilirim?<p>Merhaba! Ben NOVA AI. 🤍</p></div>
<div id="suggestions">
<button class="suggestion" type="button" data-prompt="Bana ilginç bir bilgi ver.">💡 İlginç bir bilgi</button>
<button class="suggestion" type="button" data-prompt="Bana yaratıcı bir proje öner.">✨ Proje öner</button>
<button class="suggestion" type="button" data-prompt="Bu kodu açıklamama yardım et.">⌨️ Kodlama</button>
<button class="suggestion" type="button" data-prompt="Bugün ne öğrenebilirim?">📚 Bir şey öğren</button>
</div>
</div>

<form id="form">
<div id="composer">
<button id="mic" type="button" aria-label="Sesle yaz">🎙</button>
<textarea id="message" rows="1" placeholder="NOVA AI'ya mesaj gönder..." autocomplete="off" required></textarea>
<button id="send" type="submit" aria-label="Mesaj gönder">↑</button>
</div>
</form>
<div id="status">Groq destekli NOVA AI</div>

<script>
const chat=document.getElementById("chat");
const form=document.getElementById("form");
const input=document.getElementById("message");
const send=document.getElementById("send");
const welcome=document.getElementById("welcome");
const suggestions=document.getElementById("suggestions");
const statusText=document.getElementById("status");
const historyPanel=document.getElementById("historyPanel");
const historyList=document.getElementById("historyList");

let conversations=[];
let currentMessages=[];
let busy=false;

function add(text,type){
const el=document.createElement("div");
el.className="msg "+type;
el.textContent=text;
chat.appendChild(el);
chat.scrollTop=chat.scrollHeight;
return el;
}

function renderHistory(){
historyList.replaceChildren();
conversations.forEach((c,i)=>{
const b=document.createElement("button");
b.className="history-item";
b.textContent=c.title;
b.onclick=()=>loadConversation(i);
historyList.appendChild(b);
});
}

function saveConversation(){
if(!currentMessages.length)return;
const title=currentMessages.find(m=>m.type==="user")?.text.slice(0,45)||"Yeni sohbet";
if(!conversations.length||conversations[0].id!==currentMessages[0].id){
conversations.unshift({id:currentMessages[0].id,title,messages:[...currentMessages]});
}else{
conversations[0].messages=[...currentMessages];
}
renderHistory();
}

function loadConversation(i){
const c=conversations[i];
if(!c)return;
currentMessages=[...c.messages];
chat.replaceChildren();
currentMessages.forEach(m=>add(m.text,m.type));
historyPanel.classList.remove("open");
}

function newChat(){
if(currentMessages.length)saveConversation();
currentMessages=[];
chat.replaceChildren(welcome,suggestions);
input.value="";
welcome.style.display="";
suggestions.style.display="";
historyPanel.classList.remove("open");
input.focus();
}

document.getElementById("newchat").onclick=newChat;
document.getElementById("sideNew").onclick=newChat;
document.getElementById("historyBtn").onclick=()=>historyPanel.classList.add("open");
document.getElementById("closeHistory").onclick=()=>historyPanel.classList.remove("open");
historyPanel.addEventListener("click",e=>{
if(e.target===historyPanel)historyPanel.classList.remove("open");
});

document.querySelectorAll("[data-prompt]").forEach(b=>{
b.onclick=()=>{
input.value=b.dataset.prompt;
form.requestSubmit();
};
});

input.addEventListener("input",()=>{
input.style.height="auto";
input.style.height=Math.min(input.scrollHeight,130)+"px";
});

form.addEventListener("submit",async e=>{
e.preventDefault();
if(busy)return;
const message=input.value.trim();
if(!message)return;

welcome.style.display="none";
suggestions.style.display="none";
const userMsg={id:Date.now(),text:message,type:"user"};
currentMessages.push(userMsg);
add(message,"user");
input.value="";
input.style.height="auto";
busy=true;
send.disabled=true;
statusText.textContent="NOVA düşünüyor...";
const loading=add("Düşünüyorum...","bot");

try{
const r=await fetch("/api/chat",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({message})
});
const data=await r.json();
if(!r.ok)throw new Error(data.error||"HTTP "+r.status);
const reply=data.reply||data.error||"Yanıt alınamadı.";
loading.textContent=reply;
currentMessages.push({id:Date.now(),text:reply,type:"bot"});
saveConversation();
statusText.textContent="NOVA hazır";
}catch(err){
loading.textContent="Bağlantı hatası: "+err.message;
statusText.textContent="Bağlantı sorunu";
}
busy=false;
send.disabled=false;
input.focus();
});

document.getElementById("mic").onclick=()=>{
const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
if(!SpeechRecognition){
statusText.textContent="Ses tanıma bu tarayıcıda desteklenmiyor.";
return;
}
const recognition=new SpeechRecognition();
recognition.lang="tr-TR";
recognition.interimResults=false;
recognition.onstart=()=>statusText.textContent="Dinliyorum...";
recognition.onresult=e=>{
input.value=e.results[0][0].transcript;
form.requestSubmit();
};
recognition.onerror=()=>statusText.textContent="Mikrofon kullanılamadı";
recognition.onend=()=>{
if(!busy)statusText.textContent="NOVA hazır";
};
recognition.start();
};
</script>
</body>
</html>
